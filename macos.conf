# macOS overrides

# macOS font setup
font_family                          MesloLGM NF
font_size                            20

# Kitty launched from GUI may miss Homebrew/Nix PATH entries.
exe_search_path                      /opt/homebrew/bin:/usr/local/bin
open_url_with                        firefox
# Fallback if Firefox is only available as an app bundle:
# open_url_with                      /Applications/Firefox.app/Contents/MacOS/firefox

# macOS-only behavior
macos_quit_when_last_window_closed   yes
